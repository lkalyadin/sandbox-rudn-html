# Слой 4 из 4, вариант с TLS.
# Включается через ENABLE_TLS=true в .env.
#
# Сертификаты: положите fullchain.pem и privkey.pem в каталог TLS_CERT_DIR.
# Если их нет — edge сгенерирует self-signed, и браузер покажет
# предупреждение (для внутреннего стенда это нормально).
# С Let's Encrypt лучше выпустить сертификат снаружи и просто положить файлы.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream opencode_upstream {
  server sandbox:4096;
  keepalive 32;
}

# Редирект на HTTPS, но с исключением для проверок ACME.
server {
  listen 80 default_server;
  server_name _;
  server_tokens off;

  location /.well-known/acme-challenge/ {
    root /var/www/acme;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen ${EDGE_HTTPS_PORT} ssl;
  http2 on;
  server_name _;

  ssl_certificate     ${CERT_DIR}/fullchain.pem;
  ssl_certificate_key ${CERT_DIR}/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 64m;
  server_tokens off;

  location / {
    # auth_basic "demo";
    # auth_basic_user_file /etc/nginx/htpasswd;

    proxy_pass http://opencode_upstream;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 30s;

    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
  }

  # ── Скачивание результатов работы агента ──────────────────────────────────
  # Тот же каталог, что /work внутри песочницы, примонтирован сюда только на
  # чтение. Студент открывает /files/ и забирает всё, что сделал агент.
  #
  # Пароль — тот же, что у OpenCode: edge/htpasswd генерируется при запуске
  # из SANDBOX_PASSWORD, поэтому второй секрет заводить не нужно.
  location /files/ {
    auth_basic "opencode";
    auth_basic_user_file /etc/nginx/htpasswd;

    alias /srv/files/;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # Файлы отдаём на скачивание, а не открываем в браузере: иначе
    # загруженный студентом HTML выполнялся бы на том же origin, что и UI,
    # и мог бы вычитать пароль из localStorage.
    if (-f $request_filename) {
      add_header Content-Disposition "attachment" always;
      add_header X-Content-Type-Options nosniff always;
    }

    # Служебные файлы наружу не выкладываем.
    location ~ /\. { deny all; }
  }
}
