# Слой 4 из 4: то, что торчит наружу.
#
# Вариант без TLS: студенты открывают http://<IP>:<порт> и всё.
# Один URL, один логин, ноль настройки. Пароль уходит по сети открытым
# текстом — для внутреннего демо это осознанный компромисс.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream opencode_upstream {
  server sandbox:4096;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;

  # Загрузка файлов/скриншотов в чат.
  client_max_body_size 64m;

  server_tokens off;

  location / {
    # ── опциональный второй слой: basic auth ──────────────────────────────
    # Нужен, только если хочется закрыть стенд от случайных людей до того,
    # как они увидят форму входа OpenCode. Логин станет вторым.
    #   printf 'demo:%s\n' "$(openssl passwd -apr1 'пароль')" > edge/htpasswd
    # auth_basic "demo";
    # auth_basic_user_file /etc/nginx/htpasswd;

    proxy_pass http://opencode_upstream;
    proxy_http_version 1.1;

    # Веб-UI и поток событий OpenCode держат WebSocket и SSE.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Агент может думать минутами: стандартных 60 секунд не хватает.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 30s;

    # Стриминг ответа модели должен идти сразу, без буферизации.
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
  }

  # ── Скачивание результатов работы агента ──────────────────────────────────
  # Тот же каталог, что /work внутри песочницы, примонтирован сюда только на
  # чтение. Студент открывает /files/ и забирает всё, что сделал агент.
  #
  # Пароль — тот же, что у OpenCode: edge/htpasswd генерируется при запуске
  # из SANDBOX_PASSWORD, поэтому второй секрет заводить не нужно.
  location /files/ {
    auth_basic "opencode";
    auth_basic_user_file /etc/nginx/htpasswd;

    alias /srv/files/;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # Файлы отдаём на скачивание, а не открываем в браузере: иначе
    # загруженный студентом HTML выполнялся бы на том же origin, что и UI,
    # и мог бы вычитать пароль из localStorage.
    if (-f $request_filename) {
      add_header Content-Disposition "attachment" always;
      add_header X-Content-Type-Options nosniff always;
    }

    # Служебные файлы наружу не выкладываем.
    location ~ /\. { deny all; }
  }
}
