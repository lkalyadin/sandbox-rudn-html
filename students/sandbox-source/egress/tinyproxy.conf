# Слой 1 из 4: единственная дверь наружу.
#
# Песочница подключена к docker-сети с internal: true, то есть у неё нет
# маршрута в интернет. Всё, что она хочет наружу, идёт через этот прокси,
# а прокси пускает только домены, перечисленные в allowlist.
#
# Зачем: даже если студент уговорит агента скачать что-то или постучаться
# по адресу — наружу пройдут только обращения к API моделей.

# Сбрасывать привилегии здесь не нужно: контейнер и так запускается
# пользователем nobody (см. user: в docker-compose.yml), а порт 8888 — не
# привилегированный. Директивы User/Group намеренно убраны: с cap_drop: ALL
# попытка setuid() привела бы к отказу запуска.

Port 8888
Listen 0.0.0.0

# Разрешаем клиентов только из docker-сетей.
Allow 172.16.0.0/12
Allow 10.0.0.0/8
Allow 192.168.0.0/16

# ── Фильтр по домену ─────────────────────────────────────────────────────────
# FilterURLs Off => фильтруем по имени хоста, а не по полному URL.
# Для HTTPS это единственное, что мы вообще видим (CONNECT host:port),
# и этого достаточно: заблокировать чужой домен мы можем, а вот читать
# содержимое чужого TLS-трафика — нет и не пытаемся.
Filter "/etc/tinyproxy/allowlist"
FilterURLs Off
FilterExtended On
FilterDefaultDeny Yes

# Только те порты, которые нужны для API.
ConnectPort 443
ConnectPort 80

# ── Прочее ───────────────────────────────────────────────────────────────────
Timeout 600
MaxClients 200
MaxRequestsPerChild 0
StartServers 3
MinSpareServers 2
MaxSpareServers 10
LogLevel Info

# Логи нужны: по ним видно, кто и куда ломился.
LogFile "/dev/stdout"
PidFile "/tmp/tinyproxy.pid"
