<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/* ─────────────────────────── токены темы ───────────────────────────
   Цвета и шрифты объявлены токенами: тема подставляется сборщиком
   (/opt/viz/kit/dashboard.py, --theme almanac|console|coral|furrow).      */
/*__THEME_CSS__*/

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.dash-app { max-width: 1180px; margin: 0 auto; padding: 20px 18px 40px; }

/* ───────────────────────────── верхняя панель ────────────────────────── */
.dash-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.dash-top-text { min-width: 0; }
.dash-top h1 { margin: 0 0 4px; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; overflow-wrap: anywhere; }
.dash-question { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 72ch; }
.dash-actions { display: flex; gap: 8px; flex: 0 0 auto; }
.dash-icon-btn {
  min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
  border-radius: var(--radius); cursor: pointer;
  transition: background-color 120ms ease-out, border-color 120ms ease-out;
}
.dash-icon-btn:hover { background: var(--sheet-hover); border-color: var(--rule-strong); }
.dash-icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dash-icon-btn.sm { min-width: 32px; min-height: 32px; border-color: transparent; background: transparent; }
.dash-icon-btn.sm:hover { background: var(--sheet-hover); }

/* ─────────────────────────────── фильтры ──────────────────────────────── */
.dash-filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; padding: 12px 14px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); margin-bottom: 10px; }
.dash-filter { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--muted); }
.dash-filter select {
  min-height: 34px; padding: 0 8px; border: 1px solid var(--rule-strong); border-radius: 6px;
  background: var(--paper); color: var(--ink); font: inherit; font-size: 13px; max-width: 260px;
}
.dash-filter select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dash-selection { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 26px; margin-bottom: 14px; font-size: 12px; color: var(--muted); }
.dash-sel-base { margin-right: 4px; }
.dash-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--ink-2); font-size: 12px; }
.dash-chip-clear { border: 1px solid var(--rule-strong); background: transparent; cursor: pointer; font: inherit; font-size: 12px; min-height: 24px; }
.dash-chip-clear:hover { background: var(--sheet-hover); }
.dash-chip-clear:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ──────────────────────────────── KPI ─────────────────────────────────── */
.dash-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 16px; }
.dash-kpis[data-count="1"] { grid-template-columns: minmax(0, 280px); }
.dash-kpis[data-count="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 620px; }
.dash-kpi { padding: 12px 14px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); }
.dash-kpi-label { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
.dash-kpi-value { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.dash-kpi-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }

/* ─────────────────────────────── графики ──────────────────────────────── */
/* Раскладка карточек зависит от их числа (engine.js ставит data-count):
   4 графика — честные 2×2, 3 — в один ряд, 5–6 — 3 в ряд + 3. Иначе
   получался «3 + 1», где четвёртая карточка уже остальных и ряд рваный. */
.dash-grid { display: grid; gap: 14px; align-items: stretch; grid-auto-rows: minmax(240px, auto); }
.dash-grid[data-count="1"] { grid-template-columns: minmax(0, 760px); }
.dash-grid[data-count="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.dash-grid[data-count="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.dash-grid[data-count="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.dash-grid[data-count="5"],
.dash-grid[data-count="6"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1000px) {
  .dash-grid[data-count="3"],
  .dash-grid[data-count="4"],
  .dash-grid[data-count="5"],
  .dash-grid[data-count="6"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.dash-card {
  background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 14px 16px 12px; min-width: 0;
  /* одна высота в ряду: карточки выровнены по верхнему и нижнему краю */
  display: flex; flex-direction: column;
}
.dash-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex: 0 0 auto; }
.dash-card h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.dash-chart-body { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; }
.dash-chart-empty { padding: 28px 8px; text-align: center; color: var(--muted); font-size: 12.5px; margin: auto 0; }
.dash-axis-note { margin-top: 6px; font-size: 11px; color: var(--muted); }
.dash-note { margin: 8px 0 0; font-size: 11.5px; color: var(--muted); }

/* горизонтальные столбцы */
.dash-hbar { display: flex; flex-direction: column; gap: 3px; flex: 0 0 auto; }
.dash-hrow { display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr) minmax(52px, auto); align-items: center; gap: 8px; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
.dash-hrow:hover, .dash-hrow:focus-visible { background: var(--sheet-hover); }
.dash-hrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
.dash-hlabel { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dash-hbar.dense .dash-hlabel { font-size: 11.5px; }
.dash-htrack { position: relative; height: 14px; background: var(--track); border-radius: 3px; }
.dash-zero { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--rule-strong); }
.dash-hbar:not(.has-negative) .dash-zero { display: none; }
.dash-hbar-fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.dash-hvalue { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--ink-2); text-align: right; white-space: nowrap; }

/* svg-графики */
.dash-svg-wrap { flex: 1 1 auto; min-height: 180px; overflow-x: auto; }
.dash-svg { width: 100%; height: auto; display: block; min-width: 260px; }
.dash-grid-line, .dash-svg .dash-grid { stroke: var(--grid); stroke-width: 1; }
.dash-svg .dash-zero-line { stroke: var(--rule-strong); stroke-width: 1; }
.dash-svg .dash-tick { fill: var(--muted); font-size: 11px; font-family: var(--font-num); }
.dash-svg .dash-cat { fill: var(--muted); font-size: 11px; }
.dash-svg .dash-val { fill: var(--ink-2); font-size: 11px; font-family: var(--font-num); }
.dash-svg .dash-bar { cursor: pointer; }
.dash-svg .dash-bar:hover { opacity: 0.82; }
.dash-svg .dash-bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dash-svg .dash-line { stroke-width: 2; }
.dash-svg .dash-dot { cursor: pointer; }
.dash-svg .dash-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* таблица */
.dash-table-wrap { flex: 1 1 auto; overflow-x: auto; }
.dash-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.dash-table th, .dash-table td { padding: 5px 8px; border-bottom: 1px solid var(--rule); text-align: left; }
.dash-table th { font-weight: 600; color: var(--muted); font-size: 11px; text-transform: none; }
.dash-table td.num, .dash-table th.num { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.dash-table tbody tr { cursor: pointer; }
.dash-table tbody tr:hover, .dash-table tbody tr:focus-visible { background: var(--sheet-hover); }
.dash-table tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* ────────────────────────── подписи, skill, пусто ─────────────────────── */
.dash-meta { margin: 18px 0 0; font-size: 11.5px; color: var(--muted); }
.dash-skill { margin-top: 18px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 10px 14px; }
.dash-skill summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.dash-skill pre { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-num); font-size: 11.5px; max-height: 320px; overflow: auto; margin: 10px 0; color: var(--ink-2); }
.dash-empty { padding: 16px; background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: var(--radius); margin-bottom: 14px; font-size: 13px; }
.dash-empty p { margin: 0 0 10px; }
.dash-allhidden { grid-column: 1 / -1; padding: 24px; text-align: center; background: var(--sheet); border: 1px dashed var(--rule-strong); border-radius: var(--radius); }

/* ───────────────────────────── кнопки и поля ───────────────────────────── */
.dash-btn {
  min-height: 36px; padding: 0 14px; border: 1px solid var(--rule-strong); border-radius: 6px;
  background: var(--sheet); color: var(--ink); font: inherit; font-size: 12.5px; cursor: pointer;
  transition: background-color 120ms ease-out;
}
.dash-btn:hover { background: var(--sheet-hover); }
.dash-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ─────────────────────────── панель настроек ──────────────────────────── */
.dash-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(430px, 100vw);
  background: var(--sheet); border-left: 1px solid var(--rule); z-index: 60;
  display: flex; flex-direction: column;
  transform: translateX(100%); visibility: hidden;
  transition: transform 160ms ease-out, visibility 0s linear 160ms;
}
.dash-panel.open { transform: translateX(0); visibility: visible; transition: transform 160ms ease-out; }
.dash-panel-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.dash-panel-head h2 { margin: 0; font-size: 15px; }
.dash-tabs { display: flex; gap: 4px; padding: 10px 16px 0; }
.dash-tab-btn { min-height: 36px; padding: 0 12px; border: 0; background: transparent; color: var(--muted); border-radius: 6px 6px 0 0; font: inherit; font-size: 13px; cursor: pointer; }
.dash-tab-btn.active { background: var(--paper); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.dash-tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.dash-panel-body { flex: 1; overflow: auto; padding: 14px 16px; }
.dash-panel-foot { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--rule); }
.dash-field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; font-size: 11.5px; color: var(--muted); }
.dash-field input[type="text"], .dash-field input[type="number"], .dash-field select {
  min-height: 34px; padding: 0 8px; border: 1px solid var(--rule-strong); border-radius: 6px;
  background: var(--paper); color: var(--ink); font: inherit; font-size: 13px;
}
.dash-field input[type="color"] { width: 48px; height: 30px; padding: 2px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--paper); }
.dash-field input:focus-visible, .dash-field select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dash-toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; margin: 2px 0 10px; cursor: pointer; color: var(--ink-2); }
.dash-toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
.dash-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.dash-details { border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; margin: 10px 0; }
.dash-details summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.dash-json { width: 100%; margin: 8px 0; padding: 8px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--paper); color: var(--ink); font-family: var(--font-num); font-size: 11.5px; resize: vertical; }
.dash-cfg-card { border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
.dash-cfg-card.focus { border-color: var(--accent); }
.dash-cfg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 12.5px; }
.dash-badge { font-size: 11px; color: var(--muted); }
.dash-badge.hidden-badge { color: var(--warn-ink); }
.dash-status { margin: 6px 0 0; font-size: 11.5px; color: var(--muted); min-height: 1em; }

/* ──────────────────────────────── тултип ──────────────────────────────── */
.dash-tip {
  position: fixed; z-index: 80; pointer-events: none; max-width: 320px;
  padding: 6px 9px; border-radius: 6px; background: var(--tip-bg); color: var(--tip-ink);
  font-size: 11.5px; font-family: var(--font-sans); box-shadow: 0 6px 18px rgb(0 0 0 / 0.18);
}
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.dash-noscript { padding: 18px; background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: var(--radius); margin: 18px; font-size: 13px; }
.dash-noscript h2 { margin-top: 0; font-size: 15px; }

@media (max-width: 640px) {
  .dash-app { padding: 14px 12px 32px; }
  .dash-grid[data-count] { grid-template-columns: minmax(0, 1fr); }
  .dash-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dash-hrow { grid-template-columns: minmax(0, 40%) minmax(0, 1fr) minmax(44px, auto); }
  .dash-panel { width: 100vw; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
@media print {
  .dash-panel, .dash-actions { display: none; }
}
</style>
</head>
<body>
<noscript>
  <div class="dash-noscript">
    <h2>__TITLE__</h2>
    <p>Для интерактивных фильтров и графиков нужен JavaScript — он в этой странице включён по умолчанию. Если JavaScript отключён, ограничение такое: интерактив (фильтры, клик по категории, настройки, сохранение) не работает.</p>
    <p id="noscript-meta">__NOSCRIPT_META__</p>
  </div>
</noscript>

<div class="dash-app" id="dash-root"></div>
<aside class="dash-panel" id="dash-panel" role="dialog" aria-modal="false" aria-label="Настройки дашборда" aria-hidden="true" tabindex="-1"></aside>
<div class="dash-tip" id="dash-tip" role="status" aria-live="polite" hidden></div>

<script id="config-store">
window.__CONFIG__ = null;
window.__STATE__ = null;
</script>
<script>
window.__SPEC__ = /*__SPEC_JSON__*/null;
window.__DATA__ = /*__DATA_JSON__*/null;
</script>
<script>
/*__ENGINE_JS__*/
</script>
</body>
