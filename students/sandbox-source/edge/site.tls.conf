# Слой 4 из 4, вариант с TLS.
# Включается через ENABLE_TLS=true в .env.
#
# Сертификаты: положите fullchain.pem и privkey.pem в каталог TLS_CERT_DIR.
# Если их нет — edge сгенерирует self-signed, и браузер покажет
# предупреждение (для внутреннего стенда это нормально).
# С Let's Encrypt лучше выпустить сертификат снаружи и просто положить файлы.

upstream upload-handler {
  server upload-handler:8080;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream opencode_upstream {
  server sandbox:4096;
  keepalive 32;
}

# Редирект на HTTPS, но с исключением для проверок ACME.
server {
  listen 80 default_server;
  server_name _;
  server_tokens off;

  location /.well-known/acme-challenge/ {
    # alias, а не root: root дописывает весь URI и получается
    # /var/www/acme/.well-known/acme-challenge/<token>.
    alias /var/www/acme/;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen ${EDGE_HTTPS_PORT} ssl;
  http2 on;
  server_name _;

  ssl_certificate     ${CERT_DIR}/fullchain.pem;
  ssl_certificate_key ${CERT_DIR}/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 64m;
  server_tokens off;

  location / {
    proxy_pass http://opencode_upstream;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 30s;

    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
  }

  # ── Страница загрузки ─────────────────────────────────────────────────────
  # Отдаётся самим edge, а не из /srv/files: так она переживает ночную очистку
  # workspace. Вынесена в точный location, потому что в отличие от скачиваемых
  # файлов её нужно показывать как HTML (inline), а не отдавать вложением.
  location = /files/uploads/ {
    # Без basic-auth: ссылки на файлы должны открываться сразу (см. ниже /files/).
    # alias на файл в location, оканчивающемся на `/`, nginx склеивает с
    # index.html и падает с 500 — поэтому отдаём файл отдельным location.
    return 302 /files/uploads/index.html;
  }

  location = /files/uploads/index.html {
    alias /srv/upload-index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
  }

  # ── Свой service worker ───────────────────────────────────────────────────
  # Штатный sw.js OpenCode (workbox) перехватывает ЛЮБУЮ навигацию и отдаёт
  # закешированную оболочку /index.html. Из-за этого открыть файл результата
  # по ссылке /files/output/<файл> было невозможно: браузер не спрашивал сервер,
  # а UI OpenCode падал с «Error: Unrecognised route!».
  # Свой SW ничего не кэширует и не перехватывает запросы.
  location = /sw.js {
    alias /srv/sw.js;
    default_type application/javascript;
    add_header Service-Worker-Allowed "/" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # ── Ссылки вида /output/<файл> и /work/output/<файл> ──────────────────────
  # Агент иногда забывает префикс /files. Такие ссылки ведём на правильный
  # адрес, чтобы студент не видел ошибку роутера OpenCode.
  location ~ ^/work/(.*)$ {
    rewrite ^/work/(.*)$ /files/$1 permanent;
  }
  location ~ ^/output/(.*)$ {
    rewrite ^/output/(.*)$ /files/output/$1 permanent;
  }

  # ── Результаты работы агента ──────────────────────────────────────────────
  # Тот же каталог, что /work внутри песочницы, примонтирован сюда только на
  # чтение. Ссылка вида https://<IP>/files/output/<файл> открывается без пароля.
  #
  # Безопасность: HTML (свой или загруженный студентом) НЕ должен выполняться в
  # том же origin, что и UI OpenCode — иначе скрипт мог бы прочитать сессию из
  # localStorage. Поэтому отдаём файлы с CSP `sandbox` (opaque origin): скрипты
  # внутри визуализации работают, а доступ к origin UI — нет. Инлайновые
  # Chart.js/D3/plotly в самодостаточном HTML при этом продолжают работать.
  #
  # Автолистинг выключен: файлы доступны только по точному (uuid/имени) URL.
  location = /files {
    return 301 /files/;
  }

  # Понятные страницы вместо стандартных 404/403 nginx: студент должен видеть
  # «файл удалён ночной очисткой», а не сухой код ошибки.
  location = /files-404.html {
    internal;
    alias /srv/files-404.html;
    default_type text/html;
  }
  location = /files-403.html {
    internal;
    alias /srv/files-403.html;
    default_type text/html;
  }

  location /files/ {
    alias /srv/files/;
    autoindex off;

    error_page 404 /files-404.html;
    error_page 403 /files-403.html;

    add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-forms allow-modals allow-downloads" always;
    add_header X-Content-Type-Options nosniff always;

    # Служебные файлы наружу не выкладываем.
    location ~ /\. { deny all; }
  }

  # ── Загрузка HTML-визуализаций студентами ──────────────────────────────────
  # POST /upload/ — принимает multipart/form-data с файлом, сохраняет в /srv/files/uploads/
  # Файлы доступны сразу по /files/uploads/<uuid>.<ext>, удаляются ночной очисткой.
  location /upload/ {
    auth_basic "opencode";
    auth_basic_user_file /etc/nginx/htpasswd;

    client_max_body_size 50m;
    client_body_temp_path /tmp/nginx_upload;

    proxy_pass http://upload-handler/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
