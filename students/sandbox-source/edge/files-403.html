<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог недоступен</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #0f1115; color: #e6e8eb; margin: 0;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .box { max-width: 560px; padding: 32px 40px; background: #171a21; border-radius: 14px;
         border: 1px solid #262b36; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { line-height: 1.6; color: #aeb4bf; margin: 0 0 10px; }
  .hint { border-left: 3px solid #f59e0b; padding-left: 12px; font-size: 14px; }
</style>
</head>
<body>
  <div class="box">
    <h1>Список файлов закрыт</h1>
    <p>Папка общая для всей группы, поэтому её содержимое не показывается целиком.</p>
    <p class="hint">Откройте конкретный файл по прямой ссылке — её агент выдаёт
       в конце ответа. Такой файл откроется сразу, пароль не спрашивается.</p>
  </div>
</body>
</html>
