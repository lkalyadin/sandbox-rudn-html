# Слой 4 из 4: то, что торчит наружу.
#
# Вариант без TLS: студенты открывают http://<IP>:<порт> и всё.
# Один URL, один логин, ноль настройки. Пароль уходит по сети открытым
# текстом — для внутреннего демо это осознанный компромисс.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream opencode_upstream {
  server sandbox:4096;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;

  # Загрузка файлов/скриншотов в чат.
  client_max_body_size 64m;

  server_tokens off;

  # Проверка Let's Encrypt (HTTP-01) — см. site.tls.conf.
  location /.well-known/acme-challenge/ {
    alias /var/www/acme/;
    default_type text/plain;
  }

  location / {
    # ── опциональный второй слой: basic auth ──────────────────────────────
    # Нужен, только если хочется закрыть стенд от случайных людей до того,
    # как они увидят форму входа OpenCode. Логин станет вторым.
    #   printf 'demo:%s\n' "$(openssl passwd -apr1 'пароль')" > edge/htpasswd
    # auth_basic "demo";
    # auth_basic_user_file /etc/nginx/htpasswd;

    proxy_pass http://opencode_upstream;
    proxy_http_version 1.1;

    # Веб-UI и поток событий OpenCode держат WebSocket и SSE.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Агент может думать минутами: стандартных 60 секунд не хватает.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 30s;

    # Стриминг ответа модели должен идти сразу, без буферизации.
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
  }

  # ── Страница загрузки ─────────────────────────────────────────────────────
  # См. site.tls.conf: отдаётся edge, переживает ночную очистку workspace.
  location = /files/uploads/ {
    # Без basic-auth: ссылки открываются сразу (см. блок /files/ ниже).
    return 302 /files/uploads/index.html;
  }

  location = /files/uploads/index.html {
    alias /srv/upload-index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
  }

  # ── Свой service worker ───────────────────────────────────────────────────
  # См. site.tls.conf: штатный sw.js OpenCode перехватывает навигацию и
  # подменяет файл результата оболочкой приложения.
  location = /sw.js {
    alias /srv/sw.js;
    default_type application/javascript;
    add_header Service-Worker-Allowed "/" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # ── Ссылки вида /output/<файл> и /work/output/<файл> ──────────────────────
  location ~ ^/work/(.*)$ {
    rewrite ^/work/(.*)$ /files/$1 permanent;
  }
  location ~ ^/output/(.*)$ {
    rewrite ^/output/(.*)$ /files/output/$1 permanent;
  }

  # ── Результаты работы агента ──────────────────────────────────────────────
  # Ссылка https://<IP>/files/output/<файл> открывается без пароля.
  # CSP `sandbox` = opaque origin: скрипты визуализации работают, но доступ к
  # origin UI OpenCode (localStorage/сессия) невозможен. Листинг выключен.
  location = /files {
    return 301 /files/;
  }

  # Понятные страницы вместо стандартных 404/403 nginx.
  location = /files-404.html {
    internal;
    alias /srv/files-404.html;
    default_type text/html;
  }
  location = /files-403.html {
    internal;
    alias /srv/files-403.html;
    default_type text/html;
  }

  location /files/ {
    alias /srv/files/;
    autoindex off;

    error_page 404 /files-404.html;
    error_page 403 /files-403.html;

    add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-forms allow-modals allow-downloads" always;
    add_header X-Content-Type-Options nosniff always;

    # Служебные файлы наружу не выкладываем.
    location ~ /\. { deny all; }
  }

  # ── Загрузка HTML-визуализаций студентами ──────────────────────────────────
  # См. site.tls.conf: префикс /upload/ срезается, Flask ждёт "/" и "/health".
  location /upload/ {
    auth_basic "opencode";
    auth_basic_user_file /etc/nginx/htpasswd;

    client_max_body_size 50m;
    client_body_temp_path /tmp/nginx_upload;

    proxy_pass http://upload-handler/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
